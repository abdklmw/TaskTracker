services:
  tasktracker:
    build: .
    container_name: tasktracker
    ports:
      - "5055:8080"          # Host:Container  (change 5055 if you want)
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=TaskTracker;User Id=tasktracker_app;Password=${DB_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=true
    volumes:
      - ./data/log:/app/data/log          # Persist Serilog files on the host
    restart: unless-stopped